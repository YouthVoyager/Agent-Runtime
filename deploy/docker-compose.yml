name: stableagent

x-app-env: &app-env
  APP_ENV: local
  DATABASE_URL: postgres://stableagent:stableagent@postgres:5432/stableagent?sslmode=disable
  REDIS_ADDR: redis:6379
  TEMPORAL_ADDRESS: temporal:7233
  MINIO_ENDPOINT: minio:9000
  ARTIFACT_INLINE_MAX_BYTES: ${ARTIFACT_INLINE_MAX_BYTES:-4096}
  JAEGER_ENDPOINT: http://jaeger:14268/api/traces
  # OTel SDK 通过 OTLP HTTP 导出 trace 到 Jaeger;置空则不导出。
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
  LLM_GATEWAY_URL: http://llm-gateway:8083
  TOOL_GATEWAY_URL: http://tool-gateway:8082
  LOG_LEVEL: info
  SHUTDOWN_TIMEOUT: 15s
  WORKER_POLL_INTERVAL: 1s

x-service-build: &service-build
  context: ..
  dockerfile: Dockerfile
  target: service-runtime
  args:
    VERSION: ${VERSION:-dev}
    COMMIT: ${COMMIT:-none}
    BUILD_TIME: ${BUILD_TIME:-local}

services:
  api-service:
    build:
      <<: *service-build
      target: api-runtime
      args:
        SERVICE: api-service
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_TIME: ${BUILD_TIME:-local}
    environment:
      <<: *app-env
      API_SERVICE_HTTP_ADDR: :8080
      API_SERVICE_WEB_STATIC_DIR: /web-ui/dist
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
      minio:
        condition: service_healthy
      jaeger:
        condition: service_started

  runtime-worker:
    build:
      <<: *service-build
      args:
        SERVICE: runtime-worker
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_TIME: ${BUILD_TIME:-local}
    environment:
      <<: *app-env
      RUNTIME_WORKER_HTTP_ADDR: :8081
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_started

  tool-gateway:
    build:
      <<: *service-build
      args:
        SERVICE: tool-gateway
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_TIME: ${BUILD_TIME:-local}
    environment:
      <<: *app-env
      TOOL_GATEWAY_HTTP_ADDR: :8082
    ports:
      - "18082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  llm-gateway:
    build:
      <<: *service-build
      args:
        SERVICE: llm-gateway
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_TIME: ${BUILD_TIME:-local}
    environment:
      <<: *app-env
      LLM_GATEWAY_HTTP_ADDR: :8083
    ports:
      - "8083:8083"
    depends_on:
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stableagent
      POSTGRES_PASSWORD: stableagent
      POSTGRES_DB: stableagent
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stableagent -d stableagent"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

  temporal-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data

  temporal:
    image: temporalio/auto-setup:1.25
    environment:
      # Temporal auto-setup 的 PostgreSQL 驱动名必须使用官方支持的 postgres12。
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    volumes:
      - ./temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    ports:
      - "7233:7233"
    depends_on:
      temporal-postgres:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:2.31.2
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8088:8080"
    depends_on:
      temporal:
        condition: service_started

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - minio-data:/data

  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
      - "14268:14268"

volumes:
  postgres-data:
  redis-data:
  temporal-postgres-data:
  minio-data:
