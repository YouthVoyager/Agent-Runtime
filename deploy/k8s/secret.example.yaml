# 示例 Secret:生产环境请改用 Vault / 云 KMS / ExternalSecrets,不要提交真实凭证。
apiVersion: v1
kind: Secret
metadata:
  name: stableagent-secrets
  namespace: stableagent
type: Opaque
stringData:
  DATABASE_URL: "postgres://stableagent:CHANGE_ME@postgres:5432/stableagent?sslmode=require"
  JWT_SECRET: "CHANGE_ME"
  MINIO_ACCESS_KEY: "CHANGE_ME"
  MINIO_SECRET_KEY: "CHANGE_ME"
