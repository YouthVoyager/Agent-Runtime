apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  namespace: stableagent
  labels:
    app.kubernetes.io/name: llm-gateway
    app.kubernetes.io/part-of: stableagent
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-gateway
        app.kubernetes.io/part-of: stableagent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8083"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: llm-gateway
          # 镜像由 CI 构建:Dockerfile --build-arg SERVICE=llm-gateway
          image: registry.example.com/stableagent/llm-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8083
          env:
            - name: LLM_GATEWAY_HTTP_ADDR
              value: ":8083"
          envFrom:
            - configMapRef:
                name: stableagent-config
            - secretRef:
                name: stableagent-secrets
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: llm-gateway
  namespace: stableagent
  labels:
    app.kubernetes.io/name: llm-gateway
spec:
  selector:
    app.kubernetes.io/name: llm-gateway
  ports:
    - name: http
      port: 8083
      targetPort: http
