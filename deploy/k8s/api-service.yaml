apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
  namespace: stableagent
  labels:
    app.kubernetes.io/name: api-service
    app.kubernetes.io/part-of: stableagent
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-service
        app.kubernetes.io/part-of: stableagent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api-service
          # 镜像由 CI 构建:Dockerfile --build-arg SERVICE=api-service
          image: registry.example.com/stableagent/api-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: API_SERVICE_HTTP_ADDR
              value: ":8080"
          envFrom:
            - configMapRef:
                name: stableagent-config
            - secretRef:
                name: stableagent-secrets
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: stableagent
  labels:
    app.kubernetes.io/name: api-service
spec:
  selector:
    app.kubernetes.io/name: api-service
  ports:
    - name: http
      port: 8080
      targetPort: http
