version: "2"
sql:
  - engine: "postgresql"
    schema:
      - "db/migrations/000001_week1_baseline.up.sql"
      - "db/migrations/000002_week2_core_models.up.sql"
      - "db/migrations/000003_local_production_loop.up.sql"
      - "db/migrations/000004_design_alignment.up.sql"
      - "db/migrations/000005_admin_console.up.sql"
    queries:
      - "db/queries"
    gen:
      go:
        package: "db"
        out: "internal/infra/postgres/db"
        sql_package: "pgx/v5"
        emit_db_tags: true
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "jsonb"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - db_type: "jsonb"
            nullable: true
            go_type:
              import: "encoding/json"
              type: "RawMessage"
